<script>
/* First frame is already the right theme: read the saved look and the phone's mode before anything is drawn. */
(function () { try {
  var p = JSON.parse(localStorage.getItem('gl_prefs') || '{}'), look = p.look || 'flagship', H = document.documentElement;
  var dk = { flagshipd: 1, royal: 1, midnight: 1, deepocean: 1, ember: 1, graphite: 1 };
  if (p.follow !== false) { var d = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; look = d ? 'flagshipd' : 'flagship'; }
  var nat = { flagship: 1, flagshipd: 1, royal: 1, midnight: 1, deepocean: 1, ember: 1, graphite: 1, paper: 1, aurora: 1 };
  H.setAttribute('data-scheme', dk[look] ? 'dark' : 'light');
  H.setAttribute('data-look', nat[look] ? look : 'nature');
  if (look === 'flagship' || look === 'flagshipd') { H.setAttribute('data-acc', p.accent === 'gold' ? 'gold' : 'sapphire'); H.setAttribute('data-fl', p.flFont || 'system'); }
} catch (e) {} })();
</script>
